<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fragebogen, der deine Spielidee Schritt für Schritt aufbaut und daraus ein Spielkonzept und einen exakten KI-Bauauftrag macht.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Nordlicht</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Blaupausen-Papier, oben fixe Leiste mit Fortschritt; links Bereichsliste, rechts Fragekarte mit „drückbaren“ Antwort-Kacheln */
:root {
  --paper: #EDF0F8; --surface: #FFFFFF; --surface2: #F5F7FC; --ink: #171A33; --muted: #5A6084; --line: #D3D8EA; --line2: #B9C0DA;
  --accent: #2D3CCB; --accent-ink: #FFFFFF; --accent-soft: #E3E6FF; --sun: #FFC53D; --sun-ink: #2E2100;
  --warn: #A84B10; --warn-bg: #FFF0E3; --info: #2D5B8A; --info-bg: #E6F0FA; --ok: #1C8455;
  --grid: rgba(45, 60, 203, .07); --tl1: 88%; --tl2: 76%; --code-bg: #171A33; --code-ink: #E7E9FB;
  --f-disp: "Bungee", "Arial Black", Impact, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1128; --surface: #191C3A; --surface2: #14173180; --ink: #E8EAFA; --muted: #9BA1CA; --line: #2C3160; --line2: #3B4180;
  --accent: #8D99FF; --accent-ink: #0E1030; --accent-soft: #252B66; --sun: #FFC53D; --sun-ink: #2E2100;
  --warn: #FFAA6E; --warn-bg: #3A2414; --info: #8EC2F5; --info-bg: #15294A; --ok: #4CD596;
  --grid: rgba(141, 153, 255, .06); --tl1: 34%; --tl2: 24%; --code-bg: #0A0C1E; --code-ink: #DADDF7; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0F1128; --surface: #191C3A; --surface2: #14173180; --ink: #E8EAFA; --muted: #9BA1CA; --line: #2C3160; --line2: #3B4180;
  --accent: #8D99FF; --accent-ink: #0E1030; --accent-soft: #252B66; --sun: #FFC53D; --sun-ink: #2E2100;
  --warn: #FFAA6E; --warn-bg: #3A2414; --info: #8EC2F5; --info-bg: #15294A; --ok: #4CD596;
  --grid: rgba(141, 153, 255, .06); --tl1: 34%; --tl2: 24%; --code-bg: #0A0C1E; --code-ink: #DADDF7; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 2px solid var(--ink); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.logo { font-family: var(--f-disp); font-size: 18px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; white-space: nowrap; background: none; border: 0; padding: 0; }
.logo i { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-style: normal; font-size: 13px; box-shadow: 2px 2px 0 var(--ink); }
.prog { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; border: 1.5px solid var(--ink); }
.bar span { display: block; height: 100%; background: var(--sun); transition: width .3s; }
.prog small { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
.topbtns { display: flex; gap: 8px; margin-left: auto; }

/* Buttons */
.btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; white-space: nowrap; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { box-shadow: none; border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface); border-color: var(--line); }
.btn.danger { color: var(--warn); }
.btn.big { font-size: 18px; padding: 13px 26px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 6px 12px; font-size: 14px; }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 0; font-weight: 700; }

main { padding-block: 28px 64px; }
.eyebrow { font-family: var(--f-disp); font-size: 13px; letter-spacing: .08em; color: var(--accent); margin: 0 0 8px; }
.fine { color: var(--muted); font-size: 14px; margin: 10px 0 0; }

/* Start */
.start { display: grid; gap: 34px; max-width: 980px; }
.hero h1 { font-family: var(--f-disp); font-weight: 400; font-size: clamp(30px, 5.4vw, 54px); line-height: 1.05; letter-spacing: -.005em; max-width: 16ch; }
.hl { background: linear-gradient(transparent 58%, var(--sun) 58%, var(--sun) 92%, transparent 92%); padding: 0 .08em; color: var(--ink); }
.lead { font-size: 18px; max-width: 62ch; color: var(--muted); margin: 16px 0 0; }
.step h2 { font-size: 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.stepn { font-family: var(--f-disp); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--paper); font-size: 15px; }
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.lvl { text-align: left; background: var(--surface); border: 2px solid var(--line2); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 4px 0 var(--line2); transition: transform .1s; }
.lvl:hover { transform: translateY(-2px); }
.lvl.on { border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); background: var(--accent-soft); }
.lvl b { font-size: 19px; }
.lvl-tag { font-size: 13px; font-weight: 700; color: var(--accent); }
.lvl small { color: var(--muted); font-size: 14px; flex: 1; }
.lvl-n { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); margin-top: 6px; }
.lvl-bars { display: flex; gap: 3px; margin-bottom: 6px; }
.lvl-bars i { width: 14px; height: 8px; border-radius: 2px; background: var(--line); }
.lvl-bars i.f { background: var(--accent); }
.secpick { display: flex; flex-wrap: wrap; gap: 8px; }
.secchip { border: 2px solid var(--line2); background: var(--surface); border-radius: 99px; padding: 6px 14px 6px 10px; display: flex; gap: 6px; align-items: center; font-size: 15px; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line2); }
.secchip.on { border-color: var(--ink); color: var(--ink); text-decoration: none; box-shadow: 0 2px 0 var(--ink); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Quiz layout */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.secnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 4px; }
.navi { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px; font-size: 14px; color: var(--muted); }
.navi:hover { background: var(--surface); color: var(--ink); }
.navi.cur { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.navi.done .navi-c { color: var(--ok); }
.navi-c { font-variant-numeric: tabular-nums; font-size: 12px; }
.qcard { background: var(--surface); border: 2px solid var(--ink); border-radius: 18px; padding: clamp(18px, 3vw, 32px); box-shadow: 0 6px 0 var(--ink); min-width: 0; }
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.seclabel { font-size: 14px; font-weight: 700; color: var(--accent); }
.qcount { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.pill { font-size: 12px; font-weight: 700; background: var(--sun); color: var(--sun-ink); padding: 2px 9px; border-radius: 99px; letter-spacing: .03em; }
.pill.soft { background: var(--accent-soft); color: var(--ink); }
.qtitle { font-size: clamp(22px, 3vw, 30px); line-height: 1.2; }
.hint { color: var(--muted); margin: 8px 0 0; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; margin-top: 22px; }
.opts.wide { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.opt { position: relative; text-align: left; display: flex; flex-direction: column; background: var(--surface); border: 2px solid var(--line2); border-radius: var(--r); padding: 0; overflow: hidden; box-shadow: 0 4px 0 var(--line2); transition: transform .1s, box-shadow .1s, border-color .1s; }
.opt:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--line2); }
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line2); }
.opt.on { border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); background: var(--accent-soft); }
.opt.ai { border-style: dashed; box-shadow: none; background: var(--surface2); }
.opt.ai.on { border-style: solid; box-shadow: 0 4px 0 var(--accent); }
.pic { display: grid; place-items: center; aspect-ratio: 3 / 2; max-width: 100%; background: linear-gradient(140deg, hsl(var(--h) 80% var(--tl1)), hsl(calc(var(--h) + 40) 70% var(--tl2))); border-bottom: 2px solid var(--line2); overflow: hidden; }
.opt.on .pic { border-bottom-color: var(--accent); }
.opt.ai .pic { background: repeating-linear-gradient(45deg, var(--surface2) 0 8px, var(--line) 8px 9px); }
.pic svg { width: 100%; height: 100%; display: block; }
.emo { font-size: clamp(38px, 5vw, 48px); line-height: 1; filter: drop-shadow(0 3px 0 rgba(0,0,0,.12)); }
.pal { display: flex; width: 100%; height: 100%; }
.pal i { flex: 1; }
.otx { display: flex; flex-direction: column; gap: 3px; padding: 11px 13px 13px; }
.otx b { font-size: 16px; line-height: 1.25; }
.otx small { color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.opt kbd { position: absolute; top: 8px; left: 8px; font: 600 11px var(--f-mono); background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 5px; padding: 1px 5px; opacity: .85; }
.tick { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--ink); background: var(--surface); }
.opt.on .tick { background: var(--accent); border-color: var(--accent); }
.opt.on .tick::after { content: ""; position: absolute; left: 7px; top: 2px; width: 6px; height: 12px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: rotate(45deg); }
.badge { position: absolute; top: 8px; right: 8px; background: var(--sun); color: var(--sun-ink); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1.5px solid var(--ink); }
.txt { width: 100%; margin-top: 22px; font: inherit; font-size: 18px; padding: 14px 16px; border: 2px solid var(--ink); border-radius: 12px; background: var(--surface2); color: var(--ink); resize: vertical; }
.note { margin-top: 18px; border: 2px dashed var(--line2); border-radius: 12px; padding: 10px 14px; background: var(--surface2); }
.note[open] { border-style: solid; border-color: var(--accent); }
.note summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.note .txt.sm { margin-top: 10px; font-size: 16px; padding: 10px 12px; }
.note small { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }
.rnote { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
.txt.big { min-height: 220px; font-size: 18px; line-height: 1.5; }
.starters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { border: 1.5px solid var(--line2); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 14px; color: var(--muted); }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.fromth { font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--accent); margin-top: 4px; }
.analysis { display: grid; gap: 18px; max-width: 860px; }
.analysis h1 { font-family: var(--f-disp); font-weight: 400; font-size: clamp(28px, 4.5vw, 44px); line-height: 1.05; }
.thoughts { margin: 0; padding: 14px 18px; border-left: 4px solid var(--sun); background: var(--surface); border-radius: 0 12px 12px 0; white-space: pre-wrap; font-size: 16px; max-height: 220px; overflow: auto; }
.an-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; }
.an-list li { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
.an-list li:first-child { border-top: 0; }
.an-q { color: var(--muted); font-size: 14px; }
.an-a { font-weight: 700; overflow-wrap: anywhere; }
@media (max-width: 560px) { .an-list li { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.qnav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 26px; padding-top: 18px; border-top: 2px dashed var(--line); }
.qnav .sp { flex: 1; }
.kb { font-size: 13px; }

.qcol { display: grid; gap: 16px; min-width: 0; }
.idea { background: var(--sun); color: var(--sun-ink); border: 2px solid var(--ink); border-radius: 16px; padding: 14px 18px; box-shadow: 0 4px 0 var(--ink); }
.idea-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 14px; }
.idea-h b { font-family: var(--f-disp); font-weight: 400; letter-spacing: .03em; }
.idea-h small { margin-left: auto; font-variant-numeric: tabular-nums; }
.idea-bricks { display: flex; gap: 3px; }
.idea-bricks i { width: 18px; height: 10px; border-radius: 2px; border: 1.5px solid var(--sun-ink); }
.idea-bricks i.f { background: var(--sun-ink); }
.idea p { margin: 8px 0 0; font-size: 16px; line-height: 1.45; max-width: 75ch; }
.doc { background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: clamp(20px, 4vw, 44px); box-shadow: 0 6px 0 var(--ink); max-width: 860px; min-width: 0; }
.doc h1 { font-family: var(--f-disp); font-weight: 400; font-size: clamp(28px, 4.5vw, 42px); line-height: 1.05; }
.doc .lead2 { font-size: 18px; line-height: 1.5; margin: 14px 0 6px; max-width: 68ch; }
.doc h2 { font-size: 20px; margin: 30px 0 10px; padding-top: 14px; border-top: 2px dashed var(--line); color: var(--accent); }
.doc p, .doc li { max-width: 70ch; }
.doc ol, .doc ul { padding-left: 22px; display: grid; gap: 6px; margin: 0; }
.doc ol li::marker { font-weight: 700; color: var(--accent); }
.kv { display: grid; margin: 0; }
.kv div { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv dt { color: var(--muted); font-size: 14px; }
.kv dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.aistatus { margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); font-weight: 700; }
.h2s { font-size: 18px; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
.h2s small { color: var(--muted); font-weight: 400; font-size: 14px; }
@media (max-width: 560px) { .kv div { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.cloud { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--accent-soft); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; }
.cloud > div { flex: 1 1 260px; display: grid; gap: 2px; min-width: 0; }
.cloud small { color: var(--muted); }
.cloud .fine { flex-basis: 100%; margin: 0; }
.sharelink { flex: 1 1 240px; min-width: 0; font: 14px var(--f-mono); padding: 8px 10px; border: 2px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); }
/* Projektart & KI */
.opts.kinds { grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.thinking .spin { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; margin: 18px 0 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.aibox .cov { display: block; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 6px 0 2px; max-width: 320px; }
.aibox .cov i { display: block; height: 100%; background: var(--ok); }
/* Konto & Projekte */
.acct { display: grid; gap: 14px; background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); padding: 18px; box-shadow: 0 4px 0 var(--ink); }
.acct-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.acct-h > div:first-child { display: grid; gap: 2px; min-width: 0; }
.acct-h h2 { margin: 0; font-size: 20px; }
.acct-h small { color: var(--muted); overflow-wrap: anywhere; }
.acct form { display: grid; gap: 10px; max-width: 420px; }
.acct label { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
.acct input { font: inherit; padding: 10px 12px; border: 2px solid var(--line2); border-radius: 10px; background: var(--surface); color: var(--ink); min-width: 0; }
.acct input:focus { outline: none; border-color: var(--accent); }
.acct .msg { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
.projs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.proj { position: relative; display: grid; gap: 6px; align-content: start; text-align: left; background: var(--surface2); border: 2px solid var(--line2); border-radius: 12px; padding: 14px; min-height: 112px; }
.proj:hover { border-color: var(--ink); }
.proj.cur { border-color: var(--accent); background: var(--accent-soft); }
.proj b { overflow-wrap: anywhere; padding-right: 54px; }
.proj small { color: var(--muted); font-size: 13px; }
.proj .bar { height: 8px; flex: none; }
.proj.new { place-items: center; align-content: center; text-align: center; border-style: dashed; color: var(--accent); font-weight: 700; font-size: 17px; }
.proj.new span { font-size: 30px; line-height: 1; }
.proj-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
.proj-tools button { border: 0; background: transparent; color: var(--muted); border-radius: 6px; padding: 4px 6px; font-size: 14px; }
.proj-tools button:hover { background: var(--surface); color: var(--ink); }
.proj-tools button.arm { color: var(--warn); font-weight: 700; }
/* Ergebnis */
.result { display: grid; gap: 20px; }
.rhead { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.rhead h1 { font-family: var(--f-disp); font-weight: 400; font-size: clamp(30px, 5vw, 48px); line-height: 1.05; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); margin: 10px 0 0; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }
.rbtns { display: flex; flex-wrap: wrap; gap: 10px; }
.alerts { display: grid; gap: 8px; }
.alert { margin: 0; padding: 10px 14px; border-radius: 10px; font-size: 15px; }
.alert b { margin-right: 6px; }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.info { background: var(--info-bg); color: var(--info); }
.tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 2px solid var(--ink); }
.tab { border: 2px solid transparent; border-bottom: 0; background: none; padding: 10px 16px; border-radius: 10px 10px 0 0; font-weight: 700; color: var(--muted); white-space: nowrap; margin-bottom: -2px; }
.tab.on { background: var(--surface); border-color: var(--ink); color: var(--ink); }
.panel { display: grid; gap: 16px; min-width: 0; }
.panelbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.panelbar p { margin: 0; color: var(--muted); }

.chk { width: 100%; display: flex; gap: 14px; align-items: flex-start; text-align: left; background: var(--surface); border: 1.5px solid var(--line2); border-radius: 12px; padding: 13px 15px; }

/* Überall unbegrenzte Mehrfachauswahl. Frühere Einzelfragen (one) speichern eine einzelne Wahl weiter als Text,

  q.opts.forEach(o => { if (o.v === QUIZ_OPT || _excl.test(o.v)) o.x = true; });
});

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Feste Fragen (nur die nötigen, Stufe 1) + die Fragen der KI, vor „Zum Schluss“ */
function visible() {
  const fixed = Q.filter(q => q.l <= 1 && (!q.if || q.if(st.a)));
  const fin = fixed.filter(q => q.sec === "final");
  return fixed.filter(q => q.sec !== "final").concat(aiQs(), fin);
}
const answered = q => st.a[q.id] !== undefined && !(Array.isArray(st.a[q.id]) && !st.a[q.id].length);

/* ---------- Werte ---------- */
function val(id) {
  const x = st.a[id];
  if (x == null || x === AI || x === "") return null;
  if (Array.isArray(x)) { const y = x.filter(v => v !== AI); return y.length ? y.join(", ") : null; }
  return x;
}
function optsFor(q) {
  if (q.dyn) {
    const r = quizRank(), top = r[0].score || 1;
    return r.slice(0, 6).map((x, i) => ({ i: x.s[1], v: x.s[2], d: `${Math.round(x.score / top * 100)} % Übereinstimmung. ${x.s[3]}`, best: i === 0 }));
  }
  if (q.id === "core") {
    const r = quizRank();
    if (r[0].score > 0) { const best = r[0].s[2]; const top = r.filter(x => x.score > 0).slice(0, 3).map(x => x.s[2]);
      return q.opts.map(o => o.v === best ? Object.assign({}, o, { best: 1 }) : o)
        .sort((x, y) => (x.v === QUIZ_OPT) - (y.v === QUIZ_OPT) || (top.includes(x.v) ? top.indexOf(x.v) : 99) - (top.includes(y.v) ? top.indexOf(y.v) : 99)); }
  }
  return q.opts;
}
function descOf(q, v) {
  if (q.id === "coreQuiz") { const s = SYS.find(s => s[2] === v); return s ? s[3] : ""; }
  const o = q.opts.find(o => o.v === v);
  return o ? o.d : "";
}
function quizRank() {
  const sc = {}; SYS.forEach(s => sc[s[0]] = 0);
  Q.filter(q => q.quiz || q.id === "ideaVerb" || q.id === "ideaGoal" || q.id === "ideaRef").forEach(q => {
    const x = st.a[q.id], vs = Array.isArray(x) ? x : [x];
    vs.forEach(v => { const o = q.opts.find(o => o.v === v); if (o && o.sc) for (const k in o.sc) sc[k] += o.sc[k] * (q.quiz ? 1 : 2); });
  });
  return SYS.map(s => ({ s, score: sc[s[0]] })).sort((a, b) => b.score - a.score);
}
function fmt(q) {
  const x = st.a[q.id];
  if (x === undefined) return "–";
  if (q.t === "t" && (x === AI || x === "")) return "–";
  if (x === AI || x === "") return "KI entscheidet";
  if (Array.isArray(x)) return x.includes(AI) ? "KI entscheidet" : x.join(", ");
  return x;
}

/* ---------- Rendering ---------- */
function render() {
  /* Ältere Baupläne stammen aus der Spiele-Version */
  if (st.a.kind === undefined && Object.keys(st.a).some(k => k !== "thoughts")) st.a.kind = ["Spiel"];
  save();
  renderTop();
  const app = $("#app");
  if (st.view === "quiz") app.innerHTML = viewQuiz();
  else if (st.view === "analysis") app.innerHTML = viewAnalysis();
  else if (st.view === "result") app.innerHTML = viewResult();
  else if (st.view === "thinking") app.innerHTML = viewThinking();
  else app.innerHTML = viewStart();
  if (st.view === "quiz") { const t = $("#txt"); if (t) t.focus(); }
}
function renderTop() {
  const v = visible(), done = v.filter(answered).length, pct = v.length ? Math.round(done / v.length * 100) : 0;
  $("#prog").hidden = st.view === "start" || st.view === "thinking";
  $("#progFill").style.width = pct + "%";
  $("#progTxt").textContent = `${done} / ${v.length} Fragen`;
  $("#btnResult").hidden = st.view !== "quiz" || done === 0;
  $("#btnStart").hidden = st.view === "start";
  const nb = $("#btnNew"); nb.hidden = !Object.keys(st.a).length; nb.textContent = st.resetArm ? "Wirklich verwerfen?" : "+ Neues Projekt";
}
/* Projektname: selbst vergeben oder aus den Antworten abgeleitet */
function projTitle() {
  if (st.title) return st.title;
  const first = id => { const v = val(id); return v && (Array.isArray(st.a[id]) ? st.a[id].find(x => x !== AI) : v); };
  if (st.ai && st.ai.titel && st.ai.titel[0]) return st.ai.titel[0];
  if (!isGame(st.a)) { const k = first("kind"), g = first("gGoal"); return k && g ? `${k} · ${g}` : k || "Neues Projekt"; }
  const core = first(st.a.core === QUIZ_OPT ? "coreQuiz" : "core"), set = first("setting");
  return core && set ? `${core} · ${set}` : core || set || "Neues Spiel";
}
function startQuiz() {
  st.view = "quiz";
  const v = navList(); const f = v.find(x => !answered(x));
  st.cur = f ? f.id : (v[0] && v[0].id);
  if (!f && v.length) st.view = "result";
  render(); window.scrollTo(0, 0);
}

    </div>

      <div class="opts kinds" role="group">${kc}</div>

      <div class="levels">${lv}</div>
      <p class="fine">${aiReady() ? "Nach den Grundfragen denkt sich die KI weitere Fragen aus. Die Stufe bestimmt, wie genau sie nachfragt. Du kannst jederzeit aufhören oder später noch genauer werden." : typeof sb !== "undefined" && sb ? "Mit einem kostenlosen Konto denkt sich die KI nach den Grundfragen passende Zusatzfragen aus, bis keine Lücken mehr offen sind." : "Die Stufe bestimmt, wie genau die KI nachfragt."}</p></div>

function viewQuiz() {
  const v = navList();
  let q = v.find(x => x.id === st.cur);
  if (!q) { q = v.find(x => !answered(x)) || v[0]; st.cur = q && q.id; }
  if (!q) return `<p>Keine Fragen ausgewählt.</p>`;
  const idx = v.indexOf(q), sec = secOf(q.sec), secIdx = S.indexOf(sec);
  const inSec = v.filter(x => x.sec === q.sec), posInSec = inSec.indexOf(q) + 1;
  const nav = S.map(s => {
    const qs = v.filter(x => x.sec === s.id); if (!qs.length) return "";
    const d = qs.filter(answered).length;
    return `<button class="navi${s.id === q.sec ? " cur" : ""}${d === qs.length ? " done" : ""}" data-act="jump" data-s="${s.id}">
      <span class="navi-i">${s.icon}</span><span class="navi-n">${esc(s.name)}</span><span class="navi-c">${d}/${qs.length}</span></button>`;
  }).join("");
  const cur = st.a[q.id];
  let body = "";
  if (q.t === "t") {
    const tv = cur && cur !== AI ? cur : "";
    body = q.area ? `<textarea id="txt" class="txt${q.id === "thoughts" ? " big" : ""}" rows="${q.id === "thoughts" ? 9 : 4}" placeholder="${esc(q.ph || "")}" data-act="text">${esc(tv)}</textarea>${q.id === "thoughts" ? starterChips() : ""}`
      : `<input id="txt" class="txt" type="text" maxlength="160" placeholder="${esc(q.ph || "")}" value="${esc(tv)}" data-act="text">`;
  } else {
    const os = optsFor(q).slice();
    if (!q.noAi) os.push({ i: "🤖", v: AI, label: "Weiß nicht – KI entscheidet", d: "Die KI wählt passend zum Rest deines Konzepts.", ai: 1 });
    const many = os.length > 9;
    body = `<div class="opts${q.wide ? " wide" : ""}${many ? " many" : ""}" role="${q.t === "m" ? "group" : "radiogroup"}">${os.map((o, i) => {
      const sel = Array.isArray(cur) ? cur.includes(o.v) : cur === o.v;
      return `<button class="opt${sel ? " on" : ""}${o.ai ? " ai" : ""}${o.best ? " best" : ""}" data-act="pick" data-i="${i}" aria-pressed="${sel}">
        <span class="pic" style="--h:${hue(q.id + o.v)}">${pic(o.i)}</span>
        <span class="otx"><b>${esc(o.label || o.v)}</b>${o.d ? `<small>${esc(o.d)}</small>` : ""}${st.sugg && st.sugg[q.id] && st.sugg[q.id].includes(o.v) ? `<em class="fromth">💭 aus deinen Gedanken</em>` : ""}</span>
        ${i < 9 ? `<kbd>${i + 1}</kbd>` : ""}${q.t === "m" ? `<span class="tick" aria-hidden="true"></span>` : ""}${o.best ? `<span class="badge">${q.id === "core" ? "Passt zu deiner Idee" : "Beste Wahl"}</span>` : ""}</button>`;
    }).join("")}</div>`;
  }
  const canNext = q.t === "t" || answered(q) || !!noteOf(q.id);
  const hint = q.h || (q.t === "m" ? "Wähle so viele, wie du willst." : "");
  return `<div class="layout">
    <nav class="secnav" aria-label="Bereiche">${nav}</nav>
    <div class="qcol">${ideaPanel()}<section class="qcard" data-sec="${q.sec}">
      <div class="qmeta"><span class="seclabel">${sec.icon} Bereich ${secIdx + 1}: ${esc(sec.name)}</span>
        ${q.quiz ? `<span class="pill">Quiz</span>` : ""}${q.t === "m" ? `<span class="pill soft">Mehrfachauswahl</span>` : ""}
        <span class="qcount">${posInSec} / ${inSec.length}</span></div>
      <h2 class="qtitle">${esc(q.title)}</h2>
      ${hint ? `<p class="hint">${esc(hint)}</p>` : ""}
      ${body}
      ${q.t === "t" ? "" : noteBox(q)}
      <div class="qnav">
        <button class="btn ghost" data-act="back">← Zurück</button>
        <span class="sp"></span>
        ${q.noAi || q.t === "t" ? "" : `<button class="btn ghost" data-act="skip">Überspringen</button>`}
        <button class="btn primary" data-act="next" ${canNext ? "" : "disabled"}>${idx === v.length - 1 ? "Zur Auswertung" : "Weiter"} →</button>
      </div>
      <p class="fine kb">Tastatur: Ziffern wählen, Enter geht weiter, ← zurück.</p>

function pic(i) {

const pdfTxt = s => String(s).replace(/[„“”]/g, '"').replace(/[‘’]/g, "'").replace(/[–—]/g, "-").replace(/…/g, "...").replace(/→/g, "->").replace(/⇄/g, "<->").replace(/·/g, "-")
  .replace(/[^\x00-\xFF]/g, "").replace(/\s+/g, " ").trim();
async function savePDF(btn) {
  const J = window.jspdf && window.jspdf.jsPDF;
  const old = btn.textContent;
  if (!J || !canPDF()) { btn.textContent = "PDF hier nicht verfügbar"; setTimeout(() => btn.textContent = old, 2500); return; }
  const doc = concept(), pdf = new J({ unit: "mm", format: "a4" });
  const W = 210, M = 18, CW = W - 2 * M, BOT = 280;
  let y = M;
  const ink = [23, 26, 51], acc = [45, 60, 203], mut = [90, 96, 132];
  const need = h => { if (y + h > BOT) { pdf.addPage(); y = M; } };
  const text = (s, size, style, color, x = M, width = CW, lh = 1.45) => {
    pdf.setFont("helvetica", style); pdf.setFontSize(size); pdf.setTextColor(...color);
    const lines = pdf.splitTextToSize(pdfTxt(s), width); const h = size * 0.3528 * lh;
    lines.forEach(l => { need(h); pdf.text(l, x, y + h * 0.8); y += h; });
  };
  // Titelseite
  pdf.setFillColor(...acc); pdf.rect(0, 0, W, 95, "F");
  pdf.setFillColor(255, 197, 61); pdf.rect(0, 95, W, 4, "F");
  pdf.setTextColor(255, 255, 255); pdf.setFont("helvetica", "bold"); pdf.setFontSize(11); pdf.text(isGame(st.a) ? "SPIELKONZEPT" : "KONZEPT", M, 30);
  pdf.setFontSize(30); pdf.splitTextToSize(pdfTxt(doc.title), CW).forEach((l, i) => pdf.text(l, M, 48 + i * 12));
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(11);
  pdf.text(pdfTxt(`Erstellt mit Nordlicht am ${new Date().toLocaleDateString("de-DE")}${st.ai ? " - ausgearbeitet mit Claude" : ""}`), M, 85);
  y = 104;
  doc.blocks.forEach(b => {
    if (b.t === "h2") { need(18); y += 6; pdf.setDrawColor(...acc); pdf.setLineWidth(0.6); pdf.line(M, y, M + 14, y); y += 3; text(b.x, 15, "bold", acc); y += 1.5; }
    else if (b.t === "p") { text(b.x, 10.5, "normal", ink); y += 2; }
    else if (b.t === "ul" || b.t === "ol") b.x.forEach((it, i) => {
      const mark = b.t === "ol" ? `${i + 1}.` : "-"; need(6);
      pdf.setFont("helvetica", "bold"); pdf.setFontSize(10.5); pdf.setTextColor(...acc); pdf.text(mark, M, y + 3.6);
      text(it, 10.5, "normal", ink, M + 7, CW - 7); y += 1.2;
    });
    else if (b.t === "kv") b.x.forEach(r => {
      const yy = y; pdf.setFont("helvetica", "bold"); pdf.setFontSize(9.5);
      const kl = pdf.splitTextToSize(pdfTxt(r[0]), 48); need(kl.length * 5 + 2);
      const y0 = y; text(r[0], 9.5, "bold", mut, M, 48); const y1 = y; y = y0;
      text(r[1], 10.5, "normal", ink, M + 52, CW - 52); y = Math.max(y, y1) + 1.5;
      pdf.setDrawColor(211, 216, 234); pdf.setLineWidth(0.2); pdf.line(M, y - 0.8, W - M, y - 0.8);
    });
  });
  // Checkliste + alle Antworten
  pdf.addPage(); y = M;
  text("Launch-Checkliste", 15, "bold", acc); y += 2;
  launchItems().forEach(i => { need(10); pdf.setDrawColor(...ink); pdf.setLineWidth(0.3); pdf.rect(M, y + 1, 3.5, 3.5); text(`${i.t}: ${i.d}`, 10, "normal", ink, M + 7, CW - 7); y += 1.5; });
  y += 6; text("Alle Antworten", 15, "bold", acc); y += 2;
  const v = visible().filter(q => !q.quiz);
  S.forEach(sec => {
    const qs = v.filter(q => q.sec === sec.id && answered(q)); if (!qs.length) return;
    need(14); y += 2; text(sec.name, 11.5, "bold", ink);
    qs.forEach(q => { const y0 = y; text(q.label, 9, "normal", mut, M, 55); const y1 = y; y = y0; text(fmt(q) + (noteOf(q.id) ? `  |  Notiz: ${noteOf(q.id)}` : ""), 9.5, "normal", ink, M + 58, CW - 58); y = Math.max(y, y1) + 0.8; });
  });
  const n = pdf.getNumberOfPages();
  for (let i = 2; i <= n; i++) { pdf.setPage(i); pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...mut); pdf.text(pdfTxt(`${doc.title} - ${isGame(st.a) ? "Spielkonzept" : "Konzept"}`), M, 290); pdf.text(`${i} / ${n}`, W - M, 290, { align: "right" }); }
  const file = (pdfTxt(doc.title).replace(/[^A-Za-z0-9ÄÖÜäöüß -]/g, "").trim() || "Konzept") + (isGame(st.a) ? " - Spielkonzept.pdf" : " - Konzept.pdf");
  try {
    btn.textContent = "Speichern bestätigen …";
    await deliverPDF(pdf, file);
    btn.textContent = "PDF gespeichert ✓";
  } catch (e) {
    btn.textContent = e && e.code === "declined" ? "Abgebrochen" : "PDF ging nicht";

}

function conceptMD(doc, skip) {
  const L = [];
  let skipping = false;
  doc.blocks.forEach(b => {
    if (b.t === "h2") { skipping = skip.includes(b.x); if (!skipping) L.push("", `### ${b.x}`, ""); return; }
    if (skipping) return;
    if (b.t === "p") L.push(b.x);
    else if (b.t === "ul") b.x.forEach(i => L.push(`- ${i}`));
    else if (b.t === "ol") b.x.forEach((i, n) => L.push(`${n + 1}. ${i}`));
    else if (b.t === "kv") b.x.forEach(r => L.push(`- **${r[0]}:** ${r[1]}`));
  });
  return L;
}

function buildGamePrompt() {
  const a = st.a, v = visible().filter(q => !q.quiz), L = [];
  const doc = concept(), lvl = LEVELS.find(l => l.n === st.level);
  const P = (...x) => L.push(...x), blank = () => L.push("");
  const skill = val("devSkill");

  P(`# Spiel-Bauauftrag: „${doc.title}“ (Arbeitstitel)`, "");
  P("Dieses Dokument ist der vollständige Bauauftrag für ein Videospiel. Es wurde mit einem Fragebogen erstellt, den ich (der Auftraggeber) ausgefüllt habe. Lies es komplett, bevor du irgendetwas tust.", "");
  P("**Aufbau des Dokuments:**", "- **Teil A** – So arbeitest du (Regeln, Rangfolge, Begriffe)", "- **Teil B** – Das Spielidee-System (was für ein Spiel es ist und wie es funktioniert)", "- **Teil C** – Alle Detailvorgaben aus dem Fragebogen", "- **Teil D** – Umsetzung, Abnahme, Tests und deine erste Antwort", "");
  P("---", "", "## Teil A – So arbeitest du", "");
  P("### A1. Deine Rolle", "", "Du bist ein komplettes kleines Spielestudio in einer Person: Game Designer, Programmierer, Grafiker, Sounddesigner und Tester. Du baust dieses Spiel von Anfang bis Ende so, dass es fertig, spielbar und fehlerfrei ist.", "");
  P("### A2. Grundregeln", "");
  const rules = [
    "Setze jede Vorgabe dieses Dokuments exakt um. Weiche nur ab, wenn eine Vorgabe technisch unmöglich ist, und sag das dann ausdrücklich mit einer Alternative.",
    "Erfinde keine Features, Modi oder Systeme, die hier nicht stehen. Ausnahme: Dinge, die zwingend nötig sind, damit das Spiel vollständig funktioniert (z. B. Pausenmenü). Liste jede solche Ergänzung auf.",
    "Steht bei einem Punkt „KI entscheidet“, triff die beste Entscheidung passend zu Zielgruppe, Spielidee und Stil. Sammle alle diese Entscheidungen in der Tabelle „Meine Entscheidungen“ (Spalten: Punkt | Entscheidung | abgeleitet aus).",
    `Der Fragebogen wurde in der Detailstufe „${lvl.name}“ ausgefüllt.${st.level < 4 ? " Was hier nicht genannt ist, entscheidest du selbst, konsistent mit allen Vorgaben, und trägst es in „Meine Entscheidungen“ ein." : ""}`,
    "Ich bin kein Spieleentwickler. Viele Antworten beschreiben Gefühle und Vorlieben statt Technik. Leite daraus alle konkreten Details ab: Technik, Waffen und Angriffe, Gegnerverhalten, Zahlenwerte, Kamera, Menüs, Speichern, Datenschutz, Animationen.",
    "Lieblingsspiele sind nur eine Referenz für das Spielgefühl. Kopiere keine geschützten Namen, Figuren, Grafiken, Level, Sounds oder Musik. Das Spiel muss eigenständig sein.",
    "Schreibe vollständigen, lauffähigen Code. Keine Platzhalter wie „TODO“ oder „hier Logik einfügen“, keine gekürzten Dateien, kein „Rest wie oben“.",
    "Alle Spieltexte stehen zentral in einem Text-Objekt bzw. einer Sprachdatei. Alle Zahlenwerte stehen zentral in der Konfiguration (siehe Teil B, „Startwerte“).",
    "Wähle die Technik so, dass das Spiel auf den genannten Plattformen läuft und für meine Kenntnisse machbar ist. Bei wenig Erfahrung: HTML5/JavaScript, das ohne Installation im Browser läuft.",
    "Kommuniziere mit mir auf Deutsch, in kurzen, klaren Sätzen."
  ];
  const sk = {
    "Gar nicht": "Ich kann nicht programmieren. Erkläre jeden Schritt so, dass ein Laie ihn nachmachen kann: welche Programme ich installiere, wo ich welche Datei speichere, wie ich das Spiel starte und teste. Jeder Fachbegriff bekommt beim ersten Mal eine Erklärung in einem Satz.",
    "Anfänger": "Ich habe Grundkenntnisse. Erkläre neue Konzepte kurz und kommentiere den Code verständlich.",
    "Fortgeschritten": "Ich kann programmieren. Kommentiere nur Nicht-Offensichtliches und erkläre Architekturentscheidungen kurz.",
    "Profi": "Ich bin erfahren. Konzentriere dich auf saubere Architektur, Performance und Wartbarkeit."
  }[skill];
  if (sk) rules.push(sk);
  rules.forEach((r, i) => P(`${i + 1}. ${r}`)); blank();
  P("### A3. Rangfolge bei Widersprüchen", "", "Wenn sich Angaben widersprechen, gilt diese Reihenfolge (oben gewinnt). Melde jeden Widerspruch trotzdem bei mir.", "");
  P("1. Strikte Verbote und Schutz der Zielgruppe (Teil C, „Strikte Verbote“, „Zielgruppe“)", "2. Meine eigenen Worte: meine Gedanken (B0) und Notizen (📝) – sie präzisieren oder ändern die ausgewählten Antworten", "3. Das Spielidee-System (Teil B)", "4. Die Detailvorgaben (Teil C)", "5. Deine eigenen Entscheidungen", "");
  P("### A4. Begriffe in diesem Dokument", "");
  [["Kernschleife", "Die Handlung, die sich im Spiel ständig wiederholt und Spaß machen muss."], ["Level / Welt", "Ein Level ist ein spielbarer Abschnitt. Eine Welt ist eine Gruppe von Leveln mit gemeinsamem Ort und Thema."],
   ["Run", "Ein kompletter Durchlauf von Anfang bis zum Scheitern oder Sieg."], ["Power-up", "Ein Gegenstand, der kurzzeitig einen Vorteil gibt."],
   ["Kontrollpunkt", "Stelle, an der man nach dem Scheitern wieder startet."], ["Balancing", "Das Feineinstellen von Zahlen (Tempo, Schaden, Belohnungen), damit es fair und spannend ist."],
   ["Softlock", "Ein Zustand, in dem man nicht mehr weiterkommt und auch nicht zurück kann. Muss ausgeschlossen sein."], ["Platzhalter", "Einfache Formen oder Töne, die später durch fertige Grafik und Sounds ersetzt werden."],
   ["„KI entscheidet“", "Ich habe hier bewusst keine Vorgabe gemacht; du entscheidest."], ["Text nach „–“", "Bei jeder Antwort erklärt der Text nach dem Gedankenstrich verbindlich, was gemeint ist."]]
    .forEach(([k, x]) => P(`- **${k}:** ${x}`));
  blank();

  /* Teil B */
  P("---", "", "## Teil B – Das Spielidee-System", "");
  if (val("thoughts")) {
    P("### B0. Meine Gedanken – der Ausgangspunkt für alles", "", "So habe ich mein Spiel zuerst in eigenen Worten beschrieben. Alle Antworten unten sind daraus entstanden. Das fertige Spiel muss sich wie diese Beschreibung anfühlen. Widerspricht eine Detailantwort diesen Gedanken, frag nach.", "");
    val("thoughts").split(/\n+/).forEach(l => l.trim() && P(`> ${l.trim()}`)); blank();
  }
  P("### B1. Die Spielidee in einem Absatz", "", `> ${ideaText() || summarySentence()}`, "");
  const allNotes = visible().filter(q => noteOf(q.id) || (q.id === "finalNotes" && val("finalNotes")));
  if (allNotes.length) {
    P("### ⚠️ Wichtige Notizen des Auftraggebers", "", "Diese Notizen habe ich selbst geschrieben. Sie sind verbindlich und gehen den Auswahl-Antworten vor.", "");
    if (val("finalNotes")) P(`- **Zum Schluss:** „${val("finalNotes")}“`);
    allNotes.filter(q => noteOf(q.id)).forEach(q => P(`- **${q.label}** (Antwort: ${fmt(q)}): „${noteOf(q.id)}“`));
    blank();
  }
  P("### B2. Steckbrief", "");
  P(`- **Arbeitstitel / Namensideen:** ${doc.blocks.find(b => b.t === "kv").x[0][1]}${val("nameStyle") ? ` (gewünschter Namensstil: ${val("nameStyle")})` : ""}`);
  prof().forEach(([k, x]) => P(`- **${k}:** ${x}`));
  if (val("ideaRef")) P(`- **Gewünschtes Spielgefühl ähnlich wie:** ${val("ideaRef")} (nur als Gefühl, nicht kopieren)`);
  blank();
  P("### B3. Die Bausteine der Idee", "", "Diese Bausteine sind das Herz des Spiels. Jeder muss im fertigen Spiel klar erkennbar sein.", "");
  ["ideaVerb", "ideaGoal", "hero", "setting", "ideaChallenge", "ideaTwist", "ideaEscalation", "ideaStart", "ideaWow", "ideaFinale", "ideaRule", "ideaPerfect"].forEach(id => {
    const q = qOf(id); if (!q || !answered(q)) return; const l = answerLines(q); if (l) P(...l);
  });
  blank();
  const verbs = arrOf("ideaVerb"), w = WORLD[val("setting")] || DEF_WORLD;
  P("### B4. Die Kernschleife", "", "Das Spiel besteht aus drei ineinander greifenden Schleifen:", "");
  P(`1. **Sekunde für Sekunde:** Der Spieler ${verbs.length ? verbs.map(v => (PH.verb[v] || v).split("|").map((s, i) => i ? s : s.replace(/st$/, "t").replace(/st /, "t ")).join(" ")).join(" und ") : "führt die Hauptaktion aus"}${arrOf("ideaChallenge").length ? `, während ${arrOf("ideaChallenge").map(c => PH.ch[c]).filter(Boolean).join(" und ") || "die Herausforderung wächst"}` : ""}. Jede gelungene Aktion gibt sofort sichtbares und hörbares Feedback.`);
  P(`2. **Runde für Runde:** Ziel ist ${val("ideaGoal") ? `„${val("ideaGoal")}“` : "das Level zu schaffen"}. Dabei werden ${val("collect") && val("collect") !== "Nichts" ? val("collect") : w.item} gesammelt. Die Runde endet mit ${val("ideaFinale") ? `„${val("ideaFinale")}“` : "einer Auswertung"} und einer Belohnung.`);
  P(`3. **Tag für Tag:** ${val("progress") ? `Fortschritt durch ${val("progress")}` : "Neue Level und Belohnungen werden freigeschaltet"}${val("daily") && val("daily") !== "Nein" ? `; dazu ${val("daily")}` : ""}. Mit der Zeit wird es spannender durch ${val("ideaEscalation") || "neue Herausforderungen"}.`);
  blank();
  let bn = 5;
  P(...conceptMD(doc, ["Das Spiel in Kürze", "Umsetzungsplan", "Darauf solltest du achten", "Technik, Plattform & Geld"]).map(x => x.startsWith("### ") ? `### B${bn++}. ${x.slice(4)}` : x));
  blank();
  P(`### B${bn++}. Bildschirme & Ablauf`, "", "Das Spiel hat mindestens diese Bildschirme. Von jedem Bildschirm gibt es einen Weg zurück.", "");
  screens().forEach((s, i) => P(`${i + 1}. ${s}`));
  P("", "Ablauf: Laden → Titel → (Levelauswahl) → Spiel ⇄ Pause → Gewonnen oder Verloren → nächstes Level bzw. Nochmal.", "");
  P(`### B${bn++}. Startwerte für das Balancing`, "", "Beginne mit diesen Werten in einer zentralen Konfiguration. Du darfst sie beim Testen anpassen; nenne jede Änderung.", "", "```js", ...balancing(), "```", "");

  /* Teil C */
  P("---", "", "## Teil C – Alle Detailvorgaben", "", "Hier stehen alle Antworten aus dem Fragebogen, nach Bereichen sortiert. Der Text nach „–“ erklärt jeweils verbindlich, was gemeint ist.", "");
  let n = 1;
  S.forEach(s => {
    const qs = v.filter(q => q.sec === s.id && (answered(q) || noteOf(q.id)) && s.id !== "idea" && q.id !== "finalNotes" && q.id !== "thoughts");
    if (!qs.length) return;
    P(`### C${n++}. ${s.name}`, "");
    qs.forEach(q => { const l = answerLines(q); if (l) P(...l); });
    blank();
  });
  const taboo = Array.isArray(a.taboo) ? a.taboo.filter(x => x !== AI && x !== "Keine Einschränkungen") : [];
  P(`### C${n++}. Strikte Verbote`, "");
  if (taboo.length) taboo.forEach(t => P(`- **NIEMALS:** ${t} – ${descOf(qOf("taboo"), t)}`));
  if (kids(a)) P("- **NIEMALS:** Inhalte, Links oder Käufe, die Kinder ohne Elternschranke erreichen.");
  P("- **NIEMALS:** Geschützte Namen, Figuren, Grafiken oder Musik aus bestehenden Spielen.");
  blank();
  const c = conflicts();
  if (c.length) { P(`### C${n++}. Hinweise & mögliche Konflikte`, "", "Kläre diese Punkte mit mir, bevor du die betroffenen Teile baust:", ""); c.forEach(x => P(`- ${x.k === "warn" ? "⚠️" : "ℹ️"} ${x.t}`)); blank(); }

  /* Teil D */
  P("---", "", "## Teil D – Umsetzung & Abnahme", "");
  P("### D1. Technik", "");
  const tech = doc.blocks.findIndex(b => b.t === "h2" && b.x === "Technik, Plattform & Geld");
  if (tech >= 0) doc.blocks[tech + 1].x.forEach(x => P(`- ${x}`));
  P("- Spielzustand, Texte und Konfiguration sind klar voneinander getrennt.", "- Der Code ist in sinnvolle Teile gegliedert (z. B. Spielschleife, Eingabe, Figuren, Level, Oberfläche, Sound, Speichern).", "");
  P("### D2. Meilensteine", "");
  milestones().forEach((m, i) => P(`${i + 1}. **${m[0]}:** ${m[1]}`, `   - *Fertig, wenn:* ${DOD[m[0]] || "alles darin funktioniert und getestet ist."}`));
  if (has(a, "workflow", "Schritt für Schritt")) P("", "Nach jedem Meilenstein: stoppen, kurz zusammenfassen, was fertig ist und wie ich es teste, und auf mein OK warten.");
  else if (has(a, "workflow", "Erst eine Probe")) P("", "Liefere zuerst Meilenstein 1 als spielbare Probe und warte auf mein Feedback. Danach die restlichen Meilensteine.");
  else if (has(a, "workflow", "Alles auf einmal")) P("", "Arbeite alle Meilensteine nacheinander ab, ohne zwischendurch auf Rückmeldung zu warten.");
  blank();
  P("### D3. Abnahmekriterien", "", "Das Spiel gilt erst als fertig, wenn alles hiervon erfüllt ist:", "");
  acceptance().forEach(x => P(`- [ ] ${x}`));
  P("- [ ] Level 1 läuft genau so ab, wie in Teil B beschrieben.", "- [ ] Alle Bausteine aus B3 sind im Spiel klar erkennbar.", "");
  P("### D4. Testplan", "", "Führe diese Tests selbst gedanklich bzw. im Code durch und beschreibe mir, wie ich sie nachmache:", "");
  ["Spiel starten: In höchstens 10 Sekunden ist man im Spiel.", "Level 1 komplett durchspielen und gewinnen.", "Absichtlich scheitern: Der Neustart funktioniert wie beschrieben.",
   "Mitten im Spiel pausieren, Einstellungen ändern, weiterspielen.", "Spiel schließen und neu öffnen: Fortschritt ist noch da.",
   touch(a) ? "Auf einem kleinen Handy und einem Tablet testen: nichts ist abgeschnitten, alle Knöpfe sind gut treffbar." : "In verschiedenen Fenstergrößen testen: nichts ist abgeschnitten.",
   "Ton aus und wieder an: Musik und Effekte reagieren richtig.", "Alles aus „Strikte Verbote“ prüfen: nichts davon kommt vor.", "Zehn Minuten am Stück spielen: kein Ruckeln, kein Absturz, kein Softlock."]
    .forEach((t, i) => P(`${i + 1}. ${t}`));
  blank();
  P("### D5. Lieferumfang", "");
  P("- Vollständiger, lauffähiger Code", "- Anleitung: Wie starte ich das Spiel und wie teste ich es?", "- Tabelle „Meine Entscheidungen“", "- Liste aller Ergänzungen, die nicht im Auftrag standen", "- Liste aller verwendeten fremden Inhalte mit Lizenz (falls vorhanden)");
  if (publicLaunch(a)) P(`- Unterstützung für die Veröffentlichung auf: ${val("launchWhere")}${val("storeAssets") ? ` (${val("storeAssets")})` : ""}`);
  blank();
  P("### D6. Deine erste Antwort", "", "Beginne NICHT sofort mit Code. Antworte zuerst in dieser Reihenfolge:", "");
  P("1. **Verständnischeck:** Beantworte diese Fragen in je einem Satz:",
    "   - Was macht der Spieler die meiste Zeit?", "   - Was ist sein Ziel, und wie gewinnt er ein Level?", "   - Wie verliert man, und was passiert dann?",
    "   - Was ist der besondere Clou des Spiels?", "   - Wie läuft Level 1 ab?", "   - Für wen ist das Spiel, und was darf auf keinen Fall vorkommen?",
    "   - Wie wird das Spiel mit der Zeit spannender?", "   - Auf welchen Geräten läuft es, und wie wird es bedient?",
    "2. **Dein Plan:** Technik, Dateistruktur, Meilensteine.", "3. **Offene Fragen:** Alles, was unklar oder widersprüchlich ist.",
    "4. **Namen:** Drei Namensvorschläge im gewünschten Stil.", "5. Dann wartest du auf mein OK und startest mit Meilenstein 1.");
  return L.join("\n");
}

/* ---------- PDF des KI-Prompts ---------- */
async function savePromptPDF(btn) {
  const J = window.jspdf && window.jspdf.jsPDF, old = btn.textContent;
  if (!J || !canPDF()) { btn.textContent = "PDF hier nicht verfügbar"; setTimeout(() => btn.textContent = old, 2500); return; }
  const md = buildPrompt(), title = concept().title, pdf = new J({ unit: "mm", format: "a4" });
  const W = 210, M = 18, CW = W - 2 * M, BOT = 280, ink = [23, 26, 51], acc = [45, 60, 203], mut = [90, 96, 132];
  let y = M;
  const need = h => { if (y + h > BOT) { pdf.addPage(); y = M; } };
  const text = (s, size, style, color, x = M, width = CW, font = "helvetica") => {
    pdf.setFont(font, style); pdf.setFontSize(size); pdf.setTextColor(...color);
    const h = size * 0.3528 * 1.42;
    pdf.splitTextToSize(pdfTxt(s.replace(/\*\*/g, "").replace(/\*/g, "")), width).forEach(l => { need(h); pdf.text(l, x, y + h * 0.8); y += h; });
  };
  pdf.setFillColor(...ink); pdf.rect(0, 0, W, 70, "F"); pdf.setFillColor(255, 197, 61); pdf.rect(0, 70, W, 3, "F");
  pdf.setTextColor(255, 255, 255); pdf.setFont("helvetica", "bold"); pdf.setFontSize(10.5); pdf.text("KI-BAUAUFTRAG", M, 26);
  pdf.setFontSize(24); pdf.splitTextToSize(pdfTxt(title), CW).forEach((l, i) => pdf.text(l, M, 40 + i * 10));
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(10); pdf.text(pdfTxt(`Komplett in eine KI kopieren (z. B. Claude). Erstellt am ${new Date().toLocaleDateString("de-DE")}.`), M, 62);
  y = 82;
  let code = false;
  md.split("\n").forEach((line, idx) => {
    if (idx === 0) return;
    if (line.startsWith("```")) { code = !code; y += 1.5; return; }
    if (code) { need(4.5); pdf.setFillColor(238, 240, 248); pdf.rect(M, y, CW, 4.6, "F"); text(line, 8.5, "normal", ink, M + 2, CW - 4, "courier"); return; }
    if (!line.trim()) { y += 2; return; }
    if (line === "---") { need(8); y += 3; pdf.setDrawColor(211, 216, 234); pdf.setLineWidth(0.3); pdf.line(M, y, W - M, y); y += 3; return; }
    if (line.startsWith("## ")) { if (y > M + 40) { pdf.addPage(); y = M; } text(line.slice(3), 17, "bold", acc); y += 2; return; }
    if (line.startsWith("### ")) { need(14); y += 3; text(line.slice(4), 12.5, "bold", ink); y += 1; return; }
    if (line.startsWith("> ")) { const y0 = y; text(line.slice(2), 11, "italic", ink, M + 5, CW - 5); pdf.setDrawColor(...acc); pdf.setLineWidth(1); pdf.line(M + 1, y0 + 1, M + 1, y - 0.5); return; }
    let m;
    if ((m = line.match(/^(\s*)- \[ \] (.*)/))) { need(6); pdf.setDrawColor(...ink); pdf.setLineWidth(0.3); pdf.rect(M, y + 1, 3.2, 3.2); text(m[2], 10, "normal", ink, M + 6, CW - 6); return; }
    if ((m = line.match(/^(\s*)- (.*)/))) { const ind = m[1].length ? 6 : 0; need(5); pdf.setFillColor(...acc); pdf.circle(M + ind + 1.2, y + 2.6, 0.7, "F"); text(m[2], 10, "normal", ink, M + ind + 5, CW - ind - 5); return; }
    if ((m = line.match(/^(\s*)(\d+)\. (.*)/))) { const ind = m[1].length ? 6 : 0; need(5); pdf.setFont("helvetica", "bold"); pdf.setFontSize(10); pdf.setTextColor(...acc); pdf.text(`${m[2]}.`, M + ind, y + 3.6); text(m[3], 10, "normal", ink, M + ind + 6, CW - ind - 6); return; }
    text(line, 10, "normal", ink);
  });
  const n = pdf.getNumberOfPages();
  for (let i = 2; i <= n; i++) { pdf.setPage(i); pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...mut); pdf.text(pdfTxt(`${title} - KI-Bauauftrag`), M, 290); pdf.text(`${i} / ${n}`, W - M, 290, { align: "right" }); }
  const file = (pdfTxt(title).replace(/[^A-Za-z0-9ÄÖÜäöüß -]/g, "").trim() || "Spiel") + " - KI-Bauauftrag.pdf";
  try { btn.textContent = "Speichern bestätigen …"; await deliverPDF(pdf, file); btn.textContent = "PDF gespeichert ✓"; }
  catch (e) { btn.textContent = e && e.code === "declined" ? "Abgebrochen" : "PDF ging nicht"; }
  setTimeout(() => btn.textContent = old, 2500);
}

const NEG = [

const NEGWORDS = /\b(kein|keine|keinen|keiner|ohne|nicht|niemals|nie)\b/;

function normText(t) { return " " + t.toLowerCase().replace(/[’'`]/g, "").replace(/[^a-zäöüß0-9+\- ]+/g, " ").replace(/\s+/g, " ") + " "; }
function findAll(text, stem) {
  const out = []; let i = -1;
  while ((i = text.indexOf(" " + stem, i + 1)) !== -1) out.push(i + 1);
  return out;
}
function negated(text, pos) { return NEGWORDS.test(text.slice(Math.max(0, pos - 22), pos)); }

function analyzeThoughts(raw) {
  const t = normText(raw || ""), sugg = {};
  const add = (id, v) => { const q = qOf(id); if (!q || !q.opts.some(o => o.v === v)) return; (sugg[id] = sugg[id] || []); if (!sugg[id].includes(v)) sugg[id].push(v); };
  Object.entries(KW).forEach(([id, map]) => {
    const hits = [];
    Object.entries(map).forEach(([label, stems]) => {
      let score = 0;
      stems.split("|").forEach(s => findAll(t, s).forEach(p => { if (!negated(t, p)) score += s.trim().includes(" ") ? 2 : 1; }));
      if (score) hits.push([label, score]);
    });
    if (!hits.length) return;
    hits.sort((a, b) => b[1] - a[1]);
    const q = qOf(id);
    if (q.t === "m") hits.slice(0, q.one ? 1 : 4).forEach(h => add(id, h[0]));
    else add(id, hits[0][0]);
  });
  NEG.forEach(([stems, res]) => stems.split("|").forEach(s => findAll(t, s).forEach(p => { if (negated(t, p)) Object.entries(res).forEach(([id, v]) => add(id, v)); })));

  return sugg;
}

async function thinkWithClaude() {
  if (!aiReady() || analyzeThoughts.busy) return;
  analyzeThoughts.busy = true; st.thinkErr = ""; render();
  const cat = visible().filter(q => !q.aiq && !q.quiz && !q.dyn && q.opts.length && q.id !== "kind")
    .map(q => `${q.id}${q.t === "m" ? " (mehrere)" : ""}: ${q.title} = ${q.opts.map(o => o.v).filter(v => v !== QUIZ_OPT).join(" | ")}`).join("\n");
  const input = `Hier sind die freien Gedanken eines Laien zu einem Spiel, das er bauen möchte. Ordne seine Gedanken den Fragen unten zu.
Regeln: Nimm NUR Antworten, die klar aus dem Text hervorgehen oder sehr naheliegend sind. Verwende die Antworttexte exakt wie angegeben. Lass Fragen weg, zu denen der Text nichts sagt.
Antworte NUR mit JSON: {"antworten": {"frage_id": "Antwort" oder ["Antwort", ...]}}

GEDANKEN:
${val("thoughts")}

FRAGEN (id: Frage = Antwort | Antwort | ...):
${cat}`;
  try {
    const out = await aiCall("thoughts", input);
    const res = (out && out.antworten) || {}, sugg = Object.assign({}, st.sugg);
    Object.entries(res).forEach(([id, v]) => {
      const q = qOf(id); if (!q || !q.opts.length) return;
      const vs = (Array.isArray(v) ? v : [v]).filter(x => q.opts.some(o => o.v === x));
      if (vs.length) sugg[id] = vs;

    st.sugg = sugg;
  } catch (e) { st.thinkErr = "Die Auswertung durch Claude hat nicht geklappt. Die automatisch erkannten Antworten bleiben erhalten."; }
  analyzeThoughts.busy = false; render();
}

/* Nordlicht – KI: findet offene Stellen im Bauplan und denkt sich passende Fragen aus.
   In claude.ai läuft das über die Seite selbst (CAPS.sample), auf der Website über die Supabase-Funktion „ai“. */
const AI_MAX_ROUNDS = 20;
const DEPTH = {
  1: "nur die entscheidenden Lücken; insgesamt höchstens etwa 10 KI-Fragen",
  2: "alle wichtigen Punkte; insgesamt etwa 25 KI-Fragen",
  3: "auch Details, Sonderfälle und Feinheiten; insgesamt etwa 50 KI-Fragen",
  4: "jede Kleinigkeit, bis wirklich nichts mehr offen ist; so viele Fragen wie nötig"
};
const aiReady = () => !!CAPS.sample || (typeof sb !== "undefined" && !!sb && signedIn());
const aiWant = () => aiReady() && !st.aiDone && (st.aiRounds || 0) < AI_MAX_ROUNDS;

async function aiCall(task, prompt) {
  if (CAPS.sample) return CAPS.sample.json(prompt, { modelTier: task === "elaborate" ? "complex" : "default", cache: false });
  const { data, error } = await sb.functions.invoke("ai", { body: { task, prompt } });
  if (error) {
    let code = "";
    try { code = (await error.context.json()).error; } catch (e) {}
    throw Object.assign(new Error(code || error.message), { code });
  }
  return data.json;
}
function aiErrText(e, fallback) {
  const c = e && e.code;
  return c === "limit" ? "Du hast das Tageslimit für KI-Anfragen erreicht. Morgen geht es weiter."
    : c === "rate_limited" ? "Gerade zu viele Anfragen. Versuch es in einer Minute noch einmal."
    : c === "not_granted" ? "Die Nutzung von Claude wurde nicht erlaubt."
    : c === "auth" ? "Bitte melde dich erneut an."
    : c === "config" ? "Die KI ist auf dem Server noch nicht eingerichtet."
    : fallback;
}

/* Die Fragen der KI als normale Fragen (Bereich „ai“) */
let _aqSrc = null, _aqOut = [];
function aiQs() {
  if (st.aq === _aqSrc) return _aqOut;
  _aqSrc = st.aq;
  _aqOut = (st.aq || []).map(x => ({ id: x.id, label: x.label, title: x.title, h: x.h, sec: "ai", l: 1, t: "m", aiq: true, topic: x.topic, opts: x.opts }));
  return _aqOut;
}

/* Der bisherige Bauplan als Text für die KI */
function specText() {
  const L = [];
  if (val("thoughts")) L.push("GEDANKEN DES AUFTRAGGEBERS:", val("thoughts"), "");
  S.forEach(s => {
    const qs = visible().filter(q => q.sec === s.id && !q.quiz && q.id !== "thoughts" && (answered(q) || noteOf(q.id)));
    if (!qs.length) return;
    L.push(`[${s.name}]`);
    qs.forEach(q => L.push(`- ${q.title} → ${answered(q) ? fmt(q) : "(keine Auswahl)"}${noteOf(q.id) ? ` (Notiz: ${noteOf(q.id)})` : ""}`));
    L.push("");
  });
  const open = aiQs().filter(q => !answered(q));
  if (open.length) L.push("SCHON GESTELLT, NOCH OFFEN:", ...open.map(q => `- ${q.title}`), "");
  return L.join("\n");
}

async function aiRound() {
  if (aiRound.busy) return;
  aiRound.busy = true; st.aiErr2 = ""; st.view = "thinking"; render(); window.scrollTo(0, 0);
  const tok = aiRound.tok = (aiRound.tok || 0) + 1;
  const asked = aiQs().length;
  const prompt = `Du hilfst Laien, ein Projekt so genau zu planen, dass eine KI es danach ohne Rückfragen exakt bauen kann.

Projektart: ${val("kind") || "unbekannt"}
Gewünschte Genauigkeit: ${DEPTH[st.level]}
Bisher gestellte KI-Fragen: ${asked}

BISHERIGER BAUPLAN:
${specText()}

AUFGABE: Finde die Stellen, die für den Bau noch offen, unklar oder widersprüchlich sind, und stelle dazu die nächsten 4–7 Multiple-Choice-Fragen.
Regeln:
- Frag nur, was für genau dieses Projekt gebraucht wird. Nichts doppelt und nichts, was oben schon beantwortet ist, auch nicht in anderen Worten.
- Vom Groben ins Feine: erst Funktionen und Abläufe, dann Details.
- Laiensprache in Du-Form, keine Fachbegriffe (oder kurz in Klammern erklärt).
- Jede Frage hat 3–8 konkrete, auf das Projekt zugeschnittene Antworten: passendes Emoji, Antworttext höchstens 6 Wörter, dazu ein kurzer Erklärsatz. Mehrfachauswahl ist immer erlaubt. Markiere Antworten wie „Keine“ oder „Gar nicht“ als exklusiv. Keine Antwort „Weiß nicht“, die gibt es automatisch.
- "kurz" ist ein Stichwort aus 1–3 Wörtern für die Übersicht, "thema" der Bereich (z. B. „Bezahlung“).
- "abdeckung": wie vollständig der Bauplan für die gewünschte Genauigkeit schon ist (0–100).
- "fertig": true, wenn bei dieser Genauigkeit keine wichtigen Lücken mehr bleiben; dann bleibt "fragen" leer.
- "luecken": die noch offenen Punkte in je einem kurzen Satz.
Antworte NUR mit JSON in dieser Form:
{"abdeckung": 0, "fertig": false, "luecken": [""], "fragen": [{"thema": "", "kurz": "", "frage": "", "hilfe": "", "optionen": [{"emoji": "", "text": "", "info": "", "exklusiv": false}]}]}`;
  try {
    const out = await aiCall("questions", prompt) || {};
    if (tok !== aiRound.tok) return; /* inzwischen abgebrochen */
    const r = (st.aiRounds || 0) + 1, seen = new Set(aiQs().map(q => q.title.toLowerCase()));
    const qs = (Array.isArray(out.fragen) ? out.fragen : []).filter(f => f && f.frage && Array.isArray(f.optionen) && f.optionen.length >= 2 && !seen.has(String(f.frage).toLowerCase()))
      .slice(0, 8).map((f, i) => ({
        id: `k${r}_${i + 1}`, label: String(f.kurz || f.thema || "Detail").slice(0, 40), title: String(f.frage), h: f.hilfe ? String(f.hilfe) : "", topic: String(f.thema || ""),
        opts: f.optionen.slice(0, 10).map(o => ({ i: String(o.emoji || "•").slice(0, 8), v: String(o.text || "").slice(0, 80), d: String(o.info || ""), x: !!o.exklusiv })).filter(o => o.v)
      }));
    st.aiRounds = r; st.aiLevel = st.level;
    st.aiCov = Math.max(0, Math.min(100, +out.abdeckung || 0));
    st.aiGaps = Array.isArray(out.luecken) ? out.luecken.filter(Boolean).map(String).slice(0, 12) : [];
    if (out.fertig || !qs.length || r >= AI_MAX_ROUNDS) st.aiDone = true;
    st.aq = (st.aq || []).concat(qs);
    aiRound.busy = false;
    if (qs.length) { st.view = "quiz"; st.cur = qs[0].id; render(); window.scrollTo(0, 0); }
    else aiFinish();
  } catch (e) {
    if (tok !== aiRound.tok) return;
    aiRound.busy = false;
    st.aiErr2 = aiErrText(e, "Die KI konnte gerade keine Fragen erstellen. Versuch es noch einmal oder mach ohne KI weiter.");
    render();
  }
}
/* Nach der letzten KI-Runde: Schlussfrage oder Auswertung */
function aiFinish() {
  const f = qOf("finalNotes");

}

document.addEventListener("click", e => {

  elaborate.busy = true; st.aiErr = ""; render();
  const schema = `{"titel":["3 Namensvorschläge"],"pitch":"3-4 Sätze: was es ist und warum man es will","funktionen":[{"name":"","beschreibung":"was genau passiert, konkret"}],"bildschirme":[{"name":"","inhalt":"was man dort sieht und tun kann"}],"ablaeufe":["5-8 typische Abläufe Schritt für Schritt"],"daten":[{"name":"z. B. Kunde","felder":"welche Angaben gespeichert werden"}],"rollen":["wer darf was"],"verbindungen":["andere Dienste und wofür"],"technik":["empfohlene Technik mit kurzer Begründung"],"erste_schritte":["6-8 Umsetzungsschritte"]}`;
  const input = `Du bist ein erfahrener Produktplaner und Software-Architekt. Arbeite aus der folgenden Spezifikation ein konkretes Konzept für das Projekt aus. Bleib exakt bei den Vorgaben, triff bei „KI entscheidet“ passende Entscheidungen und erfinde keine Funktionen, die nicht dazu passen. Alles auf Deutsch, verständlich für Laien.

Antworte NUR mit JSON exakt in dieser Form (bei Listen 5-10 Einträge, passend zum Umfang):
${schema}

SPEZIFIKATION:
${buildGenPrompt()}`;
  try {
    const out = await aiCall("elaborate", input);
    if (out && typeof out === "object" && Array.isArray(out.funktionen)) { st.ai = out; st.aiSig = JSON.stringify(st.a); }
    else st.aiErr = "Die Ausarbeitung kam unvollständig zurück. Versuch es noch einmal.";
  } catch (e) { st.aiErr = aiErrText(e, "Die Ausarbeitung hat nicht geklappt. Du kannst es noch einmal versuchen."); }
  elaborate.busy = false; render();
}

/* Nordlicht – Online speichern & teilen (Supabase) */
const SUPABASE_URL = "https://vzoggokzibymbwnmgbqk.supabase.co";
const SUPABASE_KEY = "sb_publishable_2ZjnZYQzM7Sw9x0d1M1sNA_2QGUI82b";
let sb = null;
try { if (window.supabase && !(window.claude && window.claude.use)) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) {}
const CLOUD = { id: null, secret: null, msg: "", busy: false, lastSaved: "" };
try { Object.assign(CLOUD, JSON.parse(localStorage.getItem("gamebauplan.cloud")) || {}); } catch (e) {}
const cloudKeep = () => { try { localStorage.setItem("gamebauplan.cloud", JSON.stringify({ id: CLOUD.id, secret: CLOUD.secret })); } catch (e) {} };
const rnd = n => { const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789", b = crypto.getRandomValues(new Uint8Array(n)); return [...b].map(x => c[x % c.length]).join(""); };
const shareURL = () => `${location.origin}${location.pathname}?b=${CLOUD.id}`;
const AI_KEYS = ["aq", "aiRounds", "aiCov", "aiGaps", "aiDone", "aiLevel"];
const payload = () => Object.assign({ a: st.a, notes: st.notes || {}, level: st.level, ai: st.ai || null, aiSig: st.aiSig || null }, ...AI_KEYS.map(k => ({ [k]: st[k] === undefined ? null : st[k] })));
const aiRestore = d => AI_KEYS.forEach(k => { st[k] = d[k] === null ? undefined : d[k]; });
/* Teil-Link vergessen, z. B. bei einem neuen Projekt */
function cloudForget() { CLOUD.id = null; CLOUD.secret = null; CLOUD.msg = ""; CLOUD.lastSaved = ""; cloudKeep(); }

async function cloudSave(silent) {
  if (!sb || CLOUD.busy) return;
  if (!CLOUD.id || !CLOUD.secret) { CLOUD.id = rnd(10); CLOUD.secret = rnd(32); cloudKeep(); }
  CLOUD.busy = true; if (!silent) { CLOUD.msg = "Speichere …"; render(); }
  const data = JSON.stringify(payload());
  const { data: ok, error } = await sb.rpc("gb_save", { p_id: CLOUD.id, p_secret: CLOUD.secret, p_data: payload() });
  CLOUD.busy = false;
  if (error) CLOUD.msg = /gb_save|function|schema/i.test(error.message) ? "Online-Speichern ist noch nicht eingerichtet." : "Speichern hat nicht geklappt. Prüfe deine Internetverbindung.";
  else if (ok === false) { CLOUD.id = null; CLOUD.secret = null; cloudKeep(); return cloudSave(silent); }
  else { CLOUD.lastSaved = data; CLOUD.msg = "Online gespeichert ✓"; }
  if (!silent || error) render();
}
async function cloudLoad(id) {
  if (!sb) return;
  const { data, error } = await sb.rpc("gb_load", { p_id: id });
  if (error || !data) { CLOUD.msg = "Dieser Bauplan wurde nicht gefunden."; render(); return; }
  st.a = data.a || {}; st.notes = data.notes || {}; st.level = data.level || 2; st.ai = data.ai || null; st.aiSig = data.aiSig || null;
  aiRestore(data);
  st.view = "result"; st.tab = "sum";
  if (CLOUD.id !== id) { CLOUD.id = null; CLOUD.secret = null; CLOUD.msg = "Geteilter Bauplan geladen. Wenn du speicherst, entsteht deine eigene Kopie."; cloudKeep(); }
  else CLOUD.lastSaved = JSON.stringify(payload());
  render();
}
function cloudBox() {
  if (!sb) return "";
  return `<div class="cloud">
    <div><b>Online speichern & teilen</b><small>${CLOUD.id ? "Dein Bauplan hat einen eigenen Link. Änderungen werden automatisch gespeichert." : "Speichere deinen Bauplan online, um ihn zu teilen oder auf einem anderen Gerät weiterzumachen."}</small></div>
    ${CLOUD.id ? `<input class="sharelink" id="shareLink" readonly value="${esc(shareURL())}"><button class="btn sm" data-act="copylink">Link kopieren</button>` : ""}
    <button class="btn sm primary" data-act="cloud" ${CLOUD.busy ? "disabled" : ""}>${CLOUD.id ? "Jetzt speichern" : "Online speichern"}</button>
    ${CLOUD.msg ? `<p class="fine">${esc(CLOUD.msg)}</p>` : ""}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "cloud") cloudSave(false);
  if (b.dataset.act === "copylink") {
    const t = shareURL();
    navigator.clipboard.writeText(t).then(() => { b.textContent = "Kopiert ✓"; setTimeout(() => b.textContent = "Link kopieren", 2000); },
      () => { const i = document.getElementById("shareLink"); i.select(); });
  }
});
/* Automatisch speichern, sobald sich etwas ändert (nur eigener Bauplan) */
setInterval(() => { if (sb && CLOUD.id && !CLOUD.busy && JSON.stringify(payload()) !== CLOUD.lastSaved) cloudSave(true); }, 4000);
(() => { const id = new URLSearchParams(location.search).get("b"); if (sb && id && /^[A-Za-z0-9]{10}$/.test(id)) cloudLoad(id); })();

/* ---------- Konto & Projekte (Supabase Auth, Bestätigung per E-Mail) ---------- */
const AUTH = { user: null, projects: null, mode: "", email: "", msg: "", busy: false, recover: false, lastSig: "", saving: false, delArm: null };
const HASH0 = location.hash; /* vor supabase-js merken, das den Link-Teil sofort auswertet */
const HERE = () => location.origin + location.pathname;
const projData = () => ({ ...payload(), done: st.done || {}, fromThoughts: st.fromThoughts || {}, cur: st.cur, share: CLOUD.id ? { id: CLOUD.id, secret: CLOUD.secret } : null });
const projSig = () => JSON.stringify([projTitle(), projData()]);
const authErr = m => /invalid login/i.test(m) ? "E-Mail oder Passwort stimmt nicht."
  : /not confirmed/i.test(m) ? "Bitte bestätige zuerst deine E-Mail – der Link steht in der Nachricht, die wir dir geschickt haben."
  : /already registered|already been registered/i.test(m) ? "Für diese E-Mail gibt es schon ein Konto. Melde dich einfach an."
  : /password/i.test(m) && /6|short|least/i.test(m) ? "Das Passwort braucht mindestens 6 Zeichen."
  : /rate limit|too many/i.test(m) ? "Gerade wurden zu viele E-Mails verschickt. Bitte versuche es in ein paar Minuten noch einmal."
  : /gb_projects|relation|schema/i.test(m) ? "Konten sind noch nicht fertig eingerichtet."
  : "Das hat nicht geklappt. Prüfe deine Internetverbindung.";

async function projList() {
  const { data, error } = await sb.from("gb_projects").select("id,title,progress,updated_at").order("updated_at", { ascending: false });
  AUTH.projects = error ? [] : data; if (error) AUTH.msg = authErr(error.message);
  if (st.view === "start") render();
}
/* Aktuelles Projekt ins Konto speichern (nur wenn schon etwas beantwortet ist) */
async function projSave() {
  if (!sb || !AUTH.user || AUTH.saving || !Object.keys(st.a).length) return;
  const sig = projSig(); if (sig === AUTH.lastSig) return;
  if (!st.pid) st.pid = crypto.randomUUID();
  const v = visible(), progress = v.length ? Math.round(v.filter(answered).length / v.length * 100) : 0;
  const row = { id: st.pid, title: projTitle(), progress, data: projData(), updated_at: new Date().toISOString() };
  AUTH.saving = true;
  const { error } = await sb.from("gb_projects").upsert(row);
  AUTH.saving = false;
  if (error) return;
  AUTH.lastSig = sig;
  if (AUTH.projects) AUTH.projects = [{ id: row.id, title: row.title, progress, updated_at: row.updated_at }, ...AUTH.projects.filter(p => p.id !== row.id)];
}
function projFlush() { AUTH.lastSig = ""; AUTH.saving = false; projSave(); }
async function projOpen(id) {
  projFlush();
  const { data, error } = await sb.from("gb_projects").select("id,title,data").eq("id", id).single();
  if (error || !data) { AUTH.msg = "Das Projekt konnte nicht geladen werden."; return render(); }
  const d = data.data || {};
  st = Object.assign(blank(d.level), { a: d.a || {}, notes: d.notes || {}, ai: d.ai || null, aiSig: d.aiSig || null, done: d.done || {}, fromThoughts: d.fromThoughts || {}, cur: d.cur || null, pid: data.id });
  aiRestore(d);
  if (data.title !== projTitle()) st.title = data.title;
  CLOUD.id = d.share ? d.share.id : null; CLOUD.secret = d.share ? d.share.secret : null; CLOUD.msg = ""; CLOUD.lastSaved = JSON.stringify(payload()); cloudKeep();
  AUTH.lastSig = projSig(); AUTH.msg = "";
  startQuiz();
}
async function projDelete(id) {
  await sb.from("gb_projects").delete().eq("id", id);
  AUTH.projects = (AUTH.projects || []).filter(p => p.id !== id);
  if (st.pid === id) { st = blank(st.level); cloudForget(); AUTH.lastSig = ""; }
  render();
}
async function authSubmit(f) {
  const email = f.email.value.trim(), pw = f.pw ? f.pw.value : "";
  if (email) AUTH.email = email;
  AUTH.busy = true; AUTH.msg = ""; render();
  let r;
  if (AUTH.recover) r = await sb.auth.updateUser({ password: pw });
  else if (AUTH.mode === "signup") r = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: HERE() } });
  else if (AUTH.mode === "forgot") r = await sb.auth.resetPasswordForEmail(email, { redirectTo: HERE() });
  else r = await sb.auth.signInWithPassword({ email, password: pw });
  AUTH.busy = false;
  if (r.error) AUTH.msg = authErr(r.error.message);
  else if (AUTH.recover) { AUTH.recover = false; AUTH.mode = ""; AUTH.msg = "Neues Passwort gespeichert ✓"; }
  else if (AUTH.mode === "signup" && !r.data.session) {
    /* Bei schon registrierten Adressen liefert Supabase einen Nutzer ohne identities */
    if (r.data.user && r.data.user.identities && !r.data.user.identities.length) { AUTH.msg = "Für diese E-Mail gibt es schon ein Konto. Melde dich einfach an."; AUTH.mode = "login"; }
    else { AUTH.msg = `Wir haben dir eine E-Mail an ${email} geschickt. Klicke auf den Link darin, um dein Konto zu bestätigen – danach bist du automatisch angemeldet.`; AUTH.mode = "sent"; }
  } else if (AUTH.mode === "forgot") { AUTH.msg = `Wir haben dir eine E-Mail an ${email} geschickt. Über den Link darin kannst du ein neues Passwort festlegen.`; AUTH.mode = "sent"; }
  render();
}
function accountBox() {
  if (!sb) return "";
  const msg = AUTH.msg ? `<p class="msg" role="status">${esc(AUTH.msg)}</p>` : "";
  if (AUTH.recover) return `<div class="acct"><div class="acct-h"><div><h2>Neues Passwort festlegen</h2></div></div>
    <form data-form="auth"><input type="hidden" name="email" value=""><label>Neues Passwort<input name="pw" type="password" minlength="6" required autocomplete="new-password"></label>
    <button class="btn primary" ${AUTH.busy ? "disabled" : ""}>Passwort speichern</button></form>${msg}</div>`;
  if (!AUTH.user) {
    const title = { signup: "Konto erstellen", login: "Anmelden", forgot: "Passwort vergessen", sent: "Schau in dein Postfach" }[AUTH.mode] || "Projekte speichern";
    const form = !AUTH.mode || AUTH.mode === "sent" ? "" : `<form data-form="auth">
      <label>E-Mail<input name="email" type="email" required autocomplete="email" value="${esc(AUTH.email)}"></label>
      ${AUTH.mode === "forgot" ? "" : `<label>Passwort${AUTH.mode === "signup" ? " (mind. 6 Zeichen)" : ""}<input name="pw" type="password" minlength="6" required autocomplete="${AUTH.mode === "signup" ? "new-password" : "current-password"}"></label>`}
      <button class="btn primary" ${AUTH.busy ? "disabled" : ""}>${AUTH.busy ? "Einen Moment …" : { signup: "Konto erstellen", login: "Anmelden", forgot: "Link schicken" }[AUTH.mode]}</button>
      <p class="fine">${AUTH.mode === "signup" ? `Du bekommst eine E-Mail zum Bestätigen. Schon ein Konto? <button type="button" class="link" data-act="authmode" data-m="login">Anmelden</button>`
        : AUTH.mode === "login" ? `Noch kein Konto? <button type="button" class="link" data-act="authmode" data-m="signup">Konto erstellen</button> · <button type="button" class="link" data-act="authmode" data-m="forgot">Passwort vergessen?</button>`
        : `<button type="button" class="link" data-act="authmode" data-m="login">Zurück zum Anmelden</button>`}</p></form>`;
    return `<div class="acct"><div class="acct-h"><div><h2>${title}</h2>
      <small>Mit einem kostenlosen Konto bleiben alle deine Baupläne gespeichert. Du kannst jederzeit zwischen ihnen wechseln und mit einem Klick ein neues Projekt starten – auch auf anderen Geräten.</small></div>
      ${AUTH.mode ? "" : `<div class="cta"><button class="btn primary" data-act="authmode" data-m="signup">Konto erstellen</button><button class="btn" data-act="authmode" data-m="login">Anmelden</button></div>`}</div>
      ${form}${msg}${AUTH.mode === "sent" ? `<p class="fine"><button class="link" data-act="authmode" data-m="login">Zum Anmelden</button></p>` : ""}</div>`;
  }
  const ps = AUTH.projects;
  const date = t => new Date(t).toLocaleDateString("de-DE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const cards = ps === null ? `<p class="fine">Lade deine Projekte …</p>` : `<div class="projs">
    <button class="proj new" data-act="newproj"><span>+</span>Neues Projekt</button>
    ${ps.map(p => `<div class="proj${p.id === st.pid ? " cur" : ""}">
      <b>${esc(p.title || "Neues Projekt")}</b>
      <div class="bar"><span style="width:${p.progress || 0}%"></span></div>
      <small>${p.progress || 0} % · ${p.id === st.pid ? "gerade geöffnet" : "geändert " + date(p.updated_at)}</small>
      <button class="btn sm${p.id === st.pid ? "" : " primary"}" data-act="openproj" data-id="${p.id}">${p.id === st.pid ? "Weitermachen" : "Öffnen"}</button>
      <span class="proj-tools"><button data-act="renproj" data-id="${p.id}" title="Umbenennen" aria-label="Umbenennen">✎</button><button class="${AUTH.delArm === p.id ? "arm" : ""}" data-act="delproj" data-id="${p.id}" title="Löschen" aria-label="Löschen">${AUTH.delArm === p.id ? "Löschen?" : "🗑"}</button></span>
    </div>`).join("")}</div>`;
  return `<div class="acct"><div class="acct-h"><div><h2>Meine Projekte</h2><small>Angemeldet als ${esc(AUTH.user.email)}</small></div>
    <button class="btn sm ghost" data-act="logout">Abmelden</button></div>${cards}${msg}</div>`;
}
document.addEventListener("submit", e => {
  if (e.target.dataset.form === "auth") { e.preventDefault(); authSubmit(e.target); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || !sb) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act !== "delproj") AUTH.delArm = null;
  if (act === "authmode") { AUTH.mode = b.dataset.m; AUTH.msg = ""; render(); setTimeout(() => { const i = document.querySelector('.acct input[name="email"]'); if (i) i.focus(); }); }
  if (act === "logout") { projFlush(); sb.auth.signOut(); }
  if (act === "openproj") { if (id === st.pid) startQuiz(); else projOpen(id); }
  if (act === "delproj") { if (AUTH.delArm !== id) { AUTH.delArm = id; render(); } else { AUTH.delArm = null; projDelete(id); } }
  if (act === "renproj") {
    const p = AUTH.projects.find(x => x.id === id), t = (prompt("Wie soll das Projekt heißen?", p.title) || "").trim().slice(0, 80);
    if (!t || t === p.title) return;
    p.title = t; render();
    if (id === st.pid) { st.title = t; projSave(); } else sb.from("gb_projects").update({ title: t }).eq("id", id).then(() => {});
  }
});
if (sb) {
  sb.auth.onAuthStateChange((ev, session) => setTimeout(() => {
    const before = AUTH.user && AUTH.user.id, now = session && session.user;
    if (ev === "PASSWORD_RECOVERY") { AUTH.recover = true; AUTH.msg = ""; st.view = "start"; }
    if (now && now.id !== before) {
      AUTH.user = now; AUTH.mode = ""; AUTH.projects = null;
      if (/type=signup/.test(HASH0)) AUTH.msg = "Deine E-Mail ist bestätigt – willkommen! ✓";
      if (location.hash) history.replaceState(null, "", location.pathname + location.search);
      projList(); projSave();
    } else if (!now && before) {
      AUTH.user = null; AUTH.projects = null; AUTH.mode = ""; AUTH.msg = "Du bist abgemeldet."; AUTH.lastSig = "";
      st = blank(st.level); cloudForget();
    }
    render();
  }));
  /* Fehler im Bestätigungslink (z. B. abgelaufen) anzeigen */
  const h = new URLSearchParams(HASH0.slice(1));
  if (h.get("error")) { AUTH.msg = /expired|invalid/i.test(h.get("error_description") || "") ? "Der Bestätigungslink ist abgelaufen. Melde dich an oder lass dir einen neuen schicken." : "Der Link hat nicht funktioniert."; AUTH.mode = "login"; history.replaceState(null, "", location.pathname + location.search); }
  setInterval(projSave, 4000);
}

/* Start – ganz am Ende, wenn alle Teile geladen sind */
try { window.claude?.hot?.snapshot(() => ({ st })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
